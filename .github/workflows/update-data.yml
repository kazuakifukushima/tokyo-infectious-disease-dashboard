name: データ自動更新

on:
  schedule:
    # 毎日午前3時（JST）に実行（UTC 18:00）
    - cron: '0 18 * * *'
  workflow_dispatch:  # 手動実行も可能

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
    - name: リポジトリをチェックアウト
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0
    
    - name: Python環境をセットアップ
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: 依存関係をインストール
      run: |
        cd backend
        pip install -r requirements.txt
        pip install requests
    
    - name: データを更新
      run: |
        cd backend
        python update_data_scheduled.py
      env:
        PYTHONPATH: ${{ github.workspace }}/backend
      continue-on-error: false
    
    - name: 変更をコミットしてプッシュ
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        # csv_list/は不要になったため、backend/processed_data/とdata/のみをコミット
        git add backend/processed_data/ data/ public/data/ || true
        if ! git diff --staged --quiet; then
          if [ "${{ github.event_name }}" == "schedule" ]; then
            COMMIT_MSG="自動データ更新: $(date +'%Y-%m-%d %H:%M:%S')"
          else
            COMMIT_MSG="手動データ更新: $(date +'%Y-%m-%d %H:%M:%S')"
          fi
          git commit -m "$COMMIT_MSG" || exit 0
          git push || exit 0
        else
          echo "変更がないため、コミット・プッシュをスキップします"
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

